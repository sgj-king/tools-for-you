# 保存路径: /etc/nginx/sites-available/api.example.com.conf
# 用途: 首次申请证书前的临时 HTTP 配置
# 操作:
# 1. 先将本文件部署到宿主机 Nginx
# 2. 执行 certbot 申请证书
# 3. 成功后再切换到正式 HTTPS 配置 api.example.com.conf

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    access_log /var/log/nginx/new-api.access.log;
    error_log  /var/log/nginx/new-api.error.log warn;

    client_max_body_size 64m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no;
    }
}
