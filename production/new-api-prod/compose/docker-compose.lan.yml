name: ${COMPOSE_PROJECT_NAME}

services:
  new-api:
    image: ${NEW_API_IMAGE}
    container_name: ${NEW_API_CONTAINER_NAME}
    restart: unless-stopped
    command:
      - --log-dir
      - /app/logs
    env_file:
      - .env
    environment:
      TZ: ${SERVER_TIMEZONE}
      PORT: 3000
      SQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      INITIAL_ROOT_TOKEN: ${INITIAL_ROOT_TOKEN}
      INITIAL_ROOT_ACCESS_TOKEN: ${INITIAL_ROOT_ACCESS_TOKEN}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      TRUSTED_REDIRECT_DOMAINS: ${TRUSTED_REDIRECT_DOMAINS}
      TLS_INSECURE_SKIP_VERIFY: ${TLS_INSECURE_SKIP_VERIFY}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED}
      DEBUG: ${DEBUG}
      GIN_MODE: ${GIN_MODE}
      GENERATE_DEFAULT_TOKEN: ${GENERATE_DEFAULT_TOKEN}
      MEMORY_CACHE_ENABLED: ${MEMORY_CACHE_ENABLED}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED}
      BATCH_UPDATE_INTERVAL: ${BATCH_UPDATE_INTERVAL}
      SYNC_FREQUENCY: ${SYNC_FREQUENCY}
      SQL_MAX_IDLE_CONNS: ${SQL_MAX_IDLE_CONNS}
      SQL_MAX_OPEN_CONNS: ${SQL_MAX_OPEN_CONNS}
      SQL_MAX_LIFETIME: ${SQL_MAX_LIFETIME}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE}
      GLOBAL_API_RATE_LIMIT_ENABLE: ${GLOBAL_API_RATE_LIMIT_ENABLE}
      GLOBAL_API_RATE_LIMIT: ${GLOBAL_API_RATE_LIMIT}
      GLOBAL_API_RATE_LIMIT_DURATION: ${GLOBAL_API_RATE_LIMIT_DURATION}
      GLOBAL_WEB_RATE_LIMIT_ENABLE: ${GLOBAL_WEB_RATE_LIMIT_ENABLE}
      GLOBAL_WEB_RATE_LIMIT: ${GLOBAL_WEB_RATE_LIMIT}
      GLOBAL_WEB_RATE_LIMIT_DURATION: ${GLOBAL_WEB_RATE_LIMIT_DURATION}
      CRITICAL_RATE_LIMIT_ENABLE: ${CRITICAL_RATE_LIMIT_ENABLE}
      CRITICAL_RATE_LIMIT: ${CRITICAL_RATE_LIMIT}
      CRITICAL_RATE_LIMIT_DURATION: ${CRITICAL_RATE_LIMIT_DURATION}
      RELAY_TIMEOUT: ${RELAY_TIMEOUT}
      STREAMING_TIMEOUT: ${STREAMING_TIMEOUT}
      RELAY_MAX_IDLE_CONNS: ${RELAY_MAX_IDLE_CONNS}
      RELAY_MAX_IDLE_CONNS_PER_HOST: ${RELAY_MAX_IDLE_CONNS_PER_HOST}
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB}
      STREAM_SCANNER_MAX_BUFFER_MB: ${STREAM_SCANNER_MAX_BUFFER_MB}
      CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_ENABLED: ${CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_ENABLED}
      CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_INTERVAL_MINUTES: ${CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_INTERVAL_MINUTES}
      CHANNEL_UPSTREAM_MODEL_UPDATE_MIN_CHECK_INTERVAL_SECONDS: ${CHANNEL_UPSTREAM_MODEL_UPDATE_MIN_CHECK_INTERVAL_SECONDS}
      CHANNEL_UPDATE_FREQUENCY: ${CHANNEL_UPDATE_FREQUENCY}
      CHANNEL_TEST_FREQUENCY: ${CHANNEL_TEST_FREQUENCY}
      FORCE_STREAM_OPTION: ${FORCE_STREAM_OPTION}
      UPDATE_TASK: ${UPDATE_TASK}
      TASK_TIMEOUT_MINUTES: ${TASK_TIMEOUT_MINUTES}
      AZURE_DEFAULT_API_VERSION: ${AZURE_DEFAULT_API_VERSION}
      HOSTNAME: ${NODE_NAME}
      NODE_NAME: ${NODE_NAME}
    ports:
      - "0.0.0.0:${NEW_API_PORT}:3000"
    volumes:
      - ${APP_BASE_DIR}/data/new-api:/data
      - ${APP_BASE_DIR}/logs/new-api:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/api/status | grep -Eq '\"success\":\\s*true'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - backend

  mysql:
    image: ${MYSQL_IMAGE}
    container_name: ${MYSQL_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${SERVER_TIMEZONE}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --max_connections=300
      - --innodb-buffer-pool-size=512M
    volumes:
      - ${APP_BASE_DIR}/data/mysql:/var/lib/mysql
      - ./mysql/conf.d/zzz-new-api.cnf:/etc/mysql/conf.d/zzz-new-api.cnf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${SERVER_TIMEZONE}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ${APP_BASE_DIR}/data/redis:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

networks:
  backend:
    driver: bridge
