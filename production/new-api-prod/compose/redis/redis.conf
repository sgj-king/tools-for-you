# 保存路径: /opt/new-api/compose/redis/redis.conf
# 说明:
# 1. Redis 在本架构中用于缓存、会话/多节点同步、部分限流与后台协同
# 2. 单机场景下丢失 Redis 不会直接丢掉 MySQL 里的核心数据
# 3. 但会导致缓存失效、登录状态丢失、限流计数丢失，因此仍建议持久化

bind 0.0.0.0
port 6379
protected-mode yes
timeout 0
tcp-keepalive 60

# 持久化策略
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 内存与淘汰
# 对网关来说，不建议静默淘汰关键缓存和会话
maxmemory-policy noeviction

# 慢查询与日志
slowlog-log-slower-than 20000
slowlog-max-len 256
loglevel notice
