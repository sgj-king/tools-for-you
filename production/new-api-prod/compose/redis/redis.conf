# 保存路径: /opt/new-api/compose/redis/redis.conf
# 说明:
# 1. Redis 在本架构中用于缓存、会话/多节点同步、部分限流与后台协同
# 2. 单机场景下丢失 Redis 不会直接丢掉 MySQL 里的核心数据
# 3. 但会导致缓存失效、登录状态丢失、限流计数丢失，因此仍建议持久化

# 容器内部网络绑定全部接口（Docker 网桥已隔离外网，docker-compose 仅把端口映射到宿主机 127.0.0.1）
# 如果将来需要让其他主机访问 Redis，请通过 SSH 隧道或反向代理；不要直接改成公开 bind
bind 0.0.0.0 -::1
port 6379
protected-mode yes
timeout 0
tcp-keepalive 60

# 持久化策略
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 内存与淘汰
# 网关多用 Redis 缓存非关键数据，使用 LRU 淘汰避免内存爆满阻塞写入；
# 若需要保护关键 key，应在应用侧使用 PERSIST/不设 TTL，避免被淘汰
maxmemory-policy allkeys-lru

# 慢查询与日志
slowlog-log-slower-than 20000
slowlog-max-len 256
loglevel notice
