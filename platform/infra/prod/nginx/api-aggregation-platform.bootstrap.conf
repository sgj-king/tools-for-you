# Replace example domains with your real domains, then install this temporary
# HTTP-only site before issuing the first Let's Encrypt certificate.

server {
    listen 80;
    server_name app.example.com console.example.com api.example.com new-api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 200 "api-aggregation-platform nginx bootstrap\n";
    }
}
