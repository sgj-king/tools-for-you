name: ${COMPOSE_PROJECT_NAME}

services:
  gateway:
    build:
      context: ../../services/platform-fastapi
    container_name: platform-gateway-dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: platform-gateway
      SERVICE_ROLE: gateway
      SERVICE_PORT: ${SERVICE_BIND_PORT}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      MYSQL_DSN: "${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@tcp(mysql:3306)/${PLATFORM_DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: ${NATS_URL}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      BILLING_BASE_URL: ${BILLING_BASE_URL}
      POLICY_BASE_URL: ${POLICY_BASE_URL}
      RISK_BASE_URL: ${RISK_BASE_URL}
      RELAY_BASE_URL: ${RELAY_BASE_URL}
      NEW_API_BASE_URL: ${NEW_API_BASE_URL}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      billing:
        condition: service_healthy
      policy:
        condition: service_healthy
      risk:
        condition: service_healthy
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  auth:
    build:
      context: ../../services/platform-fastapi
    container_name: platform-auth-dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: platform-auth
      SERVICE_ROLE: identity
      SERVICE_PORT: ${SERVICE_BIND_PORT}
      APP_ENV: ${APP_ENV}
      DEV_DEMO_API_KEY: ${DEV_DEMO_API_KEY}
      MYSQL_DSN: "${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@tcp(mysql:3306)/${PLATFORM_DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: ${NATS_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:${AUTH_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  billing:
    build:
      context: ../../services/platform-fastapi
    container_name: platform-billing-dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: platform-billing
      SERVICE_ROLE: billing
      SERVICE_PORT: ${SERVICE_BIND_PORT}
      APP_ENV: ${APP_ENV}
      MYSQL_DSN: "${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@tcp(mysql:3306)/${PLATFORM_DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: ${NATS_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:${BILLING_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  policy:
    build:
      context: ../../services/platform-fastapi
    container_name: platform-policy-dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: platform-policy
      SERVICE_ROLE: policy
      SERVICE_PORT: ${SERVICE_BIND_PORT}
      APP_ENV: ${APP_ENV}
      MYSQL_DSN: "${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@tcp(mysql:3306)/${PLATFORM_DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: ${NATS_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:${POLICY_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  risk:
    build:
      context: ../../services/platform-fastapi
    container_name: platform-risk-dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: platform-risk
      SERVICE_ROLE: risk
      SERVICE_PORT: ${SERVICE_BIND_PORT}
      APP_ENV: ${APP_ENV}
      MYSQL_DSN: "${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@tcp(mysql:3306)/${PLATFORM_DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: ${NATS_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:${RISK_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  relay:
    build:
      context: ../../services/platform-fastapi
    container_name: platform-relay-dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: platform-relay
      SERVICE_ROLE: relay
      SERVICE_PORT: ${SERVICE_BIND_PORT}
      APP_ENV: ${APP_ENV}
      BILLING_BASE_URL: ${BILLING_BASE_URL}
      POLICY_BASE_URL: ${POLICY_BASE_URL}
      RISK_BASE_URL: ${RISK_BASE_URL}
      NEW_API_BASE_URL: ${NEW_API_BASE_URL}
      NEW_API_INTERNAL_TOKEN: ${NEW_API_INTERNAL_TOKEN}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: ${NATS_URL}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      new-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RELAY_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  ops:
    build:
      context: ../../services/platform-fastapi
    container_name: platform-ops-dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: platform-ops
      SERVICE_ROLE: operations
      SERVICE_PORT: ${SERVICE_BIND_PORT}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      MYSQL_DSN: "${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@tcp(mysql:3306)/${PLATFORM_DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: ${NATS_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      PLATFORM_OPS_SHARED_TOKEN: ${PLATFORM_OPS_SHARED_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:${OPS_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  customer-console:
    build:
      context: ../../apps/customer-console
    container_name: customer-console-dev
    restart: unless-stopped
    depends_on:
      platform-console:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CUSTOMER_CONSOLE_HOST_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  admin-console:
    build:
      context: ../../apps/admin-console
    container_name: admin-console-dev
    restart: unless-stopped
    depends_on:
      platform-console:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_CONSOLE_HOST_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - platform

  platform-console:
    build:
      context: ../../apps/platform-console
    container_name: platform-console-dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_ENV: ${PLATFORM_CONSOLE_APP_ENV}
      APP_ENV: ${APP_ENV}
      NEXT_PUBLIC_ENABLE_MOCK: ${PLATFORM_CONSOLE_ENABLE_MOCK}
      NEXT_PUBLIC_ENABLE_PLATFORM_BFF: ${PLATFORM_CONSOLE_ENABLE_PLATFORM_BFF}
      NEXT_PUBLIC_PLAYGROUND_MODE: ${PLATFORM_CONSOLE_PLAYGROUND_MODE}
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${GATEWAY_HOST_PORT}
      NEXT_PUBLIC_DOCS_URL: http://127.0.0.1:${NEW_API_HOST_PORT}
      NEXT_PUBLIC_STATUS_URL: http://127.0.0.1:${PROMETHEUS_HOST_PORT}
      NEXT_PUBLIC_CUSTOMER_CONSOLE_URL: ${CUSTOMER_CONSOLE_PUBLIC_URL}
      NEXT_PUBLIC_ADMIN_CONSOLE_URL: ${ADMIN_CONSOLE_PUBLIC_URL}
      PLAYGROUND_GATEWAY_BASE_URL: http://gateway:8080
      PLAYGROUND_DEV_API_KEY: ${PLATFORM_CONSOLE_PLAYGROUND_API_KEY}
      PLATFORM_OPS_BASE_URL: ${OPS_BASE_URL}
      PLATFORM_OPS_SHARED_TOKEN: ${PLATFORM_OPS_SHARED_TOKEN}
      PLATFORM_SESSION_SECRET: ${PLATFORM_SESSION_SECRET}
      PLATFORM_CONSOLE_COOKIE_SECURE: ${PLATFORM_CONSOLE_COOKIE_SECURE}
      PLATFORM_CONSOLE_PUBLIC_URL: ${PLATFORM_CONSOLE_PUBLIC_URL}
      PLATFORM_DB_HOST: mysql
      PLATFORM_DB_PORT: 3306
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PLATFORM_CONSOLE_HOST_PORT}:3200"
    depends_on:
      gateway:
        condition: service_started
      ops:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3200/api/healthz | grep -q '\"ok\":true'"]
      interval: 20s
      timeout: 20s
      retries: 20
      start_period: 90s
    networks:
      - platform

  digital-life:
    build:
      context: ../../../Digital_life
    container_name: digital-life-dev
    restart: unless-stopped
    environment:
      OPENCLAW_BASE_URL: ${DIGITAL_LIFE_OPENCLAW_BASE_URL}
      OPENCLAW_API_KEY: ${DIGITAL_LIFE_OPENCLAW_API_KEY}
      OPENCLAW_MODEL: ${DIGITAL_LIFE_OPENCLAW_MODEL}
      TTS_BASE_URL: ${DIGITAL_LIFE_TTS_BASE_URL}
      FREETTS_BASE_URL: ${DIGITAL_LIFE_FREETTS_BASE_URL}
      TTS_DEFAULT_VOICE: ${DIGITAL_LIFE_TTS_DEFAULT_VOICE}
      PLATFORM_GATEWAY_URL: http://gateway:8080
      PLATFORM_OPS_URL: http://ops:8080
      PLATFORM_CONSOLE_URL: http://platform-console:3200
      CUSTOMER_CONSOLE_URL: http://customer-console
      ADMIN_CONSOLE_URL: http://admin-console
      NEW_API_URL: http://new-api:3000
      PLATFORM_GATEWAY_PUBLIC_URL: http://127.0.0.1:${GATEWAY_HOST_PORT}
      PLATFORM_CONSOLE_PUBLIC_URL: ${PLATFORM_CONSOLE_PUBLIC_URL}
      CUSTOMER_CONSOLE_PUBLIC_URL: ${CUSTOMER_CONSOLE_PUBLIC_URL}
      ADMIN_CONSOLE_PUBLIC_URL: ${ADMIN_CONSOLE_PUBLIC_URL}
      NEW_API_PUBLIC_URL: http://127.0.0.1:${NEW_API_HOST_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DIGITAL_LIFE_HOST_PORT}:8008"
    volumes:
      - ../../../Digital_life/backend/data/agent_workspace:/app/backend/data/agent_workspace
    depends_on:
      gateway:
        condition: service_healthy
      ops:
        condition: service_healthy
      platform-console:
        condition: service_healthy
      new-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/api/health', timeout=3).read()\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform

  mysql:
    image: mysql:8.4.5
    container_name: mysql-dev
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - platform

  redis:
    image: redis:7.4.2-alpine
    container_name: redis-dev
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - platform

  nats:
    image: nats:2.10.23-alpine
    container_name: nats-dev
    restart: unless-stopped
    command:
      - -js
      - -m
      - "8222"
    ports:
      - "127.0.0.1:${NATS_HOST_PORT}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT}:8222"
    volumes:
      - nats_data:/data
    networks:
      - platform

  new-api:
    image: ${NEW_API_IMAGE}
    container_name: new-api-dev
    restart: unless-stopped
    command:
      - --log-dir
      - /app/logs
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      SQL_DSN: "${NEW_API_DB_USER}:${NEW_API_DB_PASSWORD}@tcp(mysql:3306)/${NEW_API_DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      SESSION_SECRET: ${NEW_API_SESSION_SECRET}
      CRYPTO_SECRET: ${NEW_API_CRYPTO_SECRET}
      INITIAL_ROOT_TOKEN: ${NEW_API_INITIAL_ROOT_TOKEN}
      INITIAL_ROOT_ACCESS_TOKEN: ${NEW_API_INITIAL_ROOT_ACCESS_TOKEN}
      GIN_MODE: release
      DEBUG: "false"
      ERROR_LOG_ENABLED: "false"
      GENERATE_DEFAULT_TOKEN: "false"
      MEMORY_CACHE_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      BATCH_UPDATE_INTERVAL: "5"
      SYNC_FREQUENCY: "60"
      RELAY_TIMEOUT: "0"
      STREAMING_TIMEOUT: "600"
      FRONTEND_BASE_URL: "http://127.0.0.1:${NEW_API_HOST_PORT}"
      TRUSTED_REDIRECT_DOMAINS: "127.0.0.1,localhost"
    ports:
      - "127.0.0.1:${NEW_API_HOST_PORT}:3000"
    volumes:
      - new_api_data:/data
      - new_api_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - platform

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus-dev
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT}:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      gateway:
        condition: service_started
    networks:
      - platform

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana-dev
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  nats_data:
  new_api_data:
  new_api_logs:
  prometheus_data:
  grafana_data:
