global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8080"]

  - job_name: billing
    metrics_path: /metrics
    static_configs:
      - targets: ["billing:8080"]

  - job_name: policy
    metrics_path: /metrics
    static_configs:
      - targets: ["policy:8080"]

  - job_name: risk
    metrics_path: /metrics
    static_configs:
      - targets: ["risk:8080"]

  - job_name: relay
    metrics_path: /metrics
    static_configs:
      - targets: ["relay:8080"]

  - job_name: new-api
    metrics_path: /api/status
    static_configs:
      - targets: ["new-api:3000"]
