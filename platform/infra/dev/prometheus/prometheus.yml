global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8080"]

  - job_name: billing
    metrics_path: /metrics
    static_configs:
      - targets: ["billing:8080"]

  - job_name: policy
    metrics_path: /metrics
    static_configs:
      - targets: ["policy:8080"]

  - job_name: risk
    metrics_path: /metrics
    static_configs:
      - targets: ["risk:8080"]

  - job_name: relay
    metrics_path: /metrics
    static_configs:
      - targets: ["relay:8080"]

# new-api 当前未导出 Prometheus 文本格式（/api/status 返回 JSON），不参与 scrape。
# 健康检查改由 Prometheus blackbox_exporter 或 docker healthcheck 兜底。
