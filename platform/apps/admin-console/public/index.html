<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>彗星科技 - 管理后台</title>
    <style>
      :root {
        --bg: #121212;
        --panel: rgba(255, 255, 255, 0.06);
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --line: rgba(255, 255, 255, 0.12);
        --accent: #f59e0b;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(245, 158, 11, 0.18), transparent 28%),
          linear-gradient(160deg, #151515 0%, #0b1020 100%);
        color: var(--ink);
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      .hero, .panel {
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(10px);
        border-radius: 18px;
      }
      .hero {
        padding: 32px;
      }
      .hero h1 {
        margin: 0 0 12px;
        font-size: 38px;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      .panel {
        padding: 24px;
      }
      .panel h2 {
        margin-top: 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      code {
        background: rgba(245, 158, 11, 0.12);
        padding: 2px 6px;
        border-radius: 6px;
      }
      ul {
        padding-left: 18px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <h1>彗星科技管理后台</h1>
        <p>这是内部管理控制台占位页。后续这里会替换成 Next.js + 管理权限体系，用于价格、路由、风控、订阅、审计和运营工具。</p>
      </section>
      <section class="grid">
        <div class="panel">
          <h2>内部服务</h2>
          <ul>
            <li><a href="http://127.0.0.1:8088/v1/info" target="_blank">Gateway Info</a></li>
            <li><a href="http://127.0.0.1:3005" target="_blank">New API UI</a></li>
            <li><a href="http://127.0.0.1:9091" target="_blank">Prometheus</a></li>
            <li><a href="http://127.0.0.1:3006" target="_blank">Grafana</a></li>
          </ul>
        </div>
        <div class="panel">
          <h2>后续管理能力</h2>
          <ul>
            <li>价格快照与套餐管理</li>
            <li>模型 profile 与供应商路由</li>
            <li>风控规则与例外名单</li>
            <li>审计日志与结算修复</li>
          </ul>
        </div>
        <div class="panel">
          <h2>边界提醒</h2>
          <ul>
            <li><code>new-api</code> 只是内部中转层</li>
            <li>客户不应该使用它的管理面板</li>
            <li>核心商业逻辑必须留在闭源服务中</li>
          </ul>
        </div>
      </section>
    </div>
  </body>
</html>
